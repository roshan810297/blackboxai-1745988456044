<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChatGPT Replica</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #121212;
      color: #e5e7eb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a {
      color: #9ca3af;
      transition: color 0.2s;
    }
    a:hover {
      color: #f9fafb;
    }
    .header-logo {
      font-weight: 700;
      font-size: 1.5rem;
      color: #fff;
      letter-spacing: 0.05em;
    }
    .chat-area {
      background-color: #202123;
      border-radius: 0.5rem;
      padding: 1rem;
      max-width: 600px;
      width: 100%;
      margin: 2rem auto 1rem;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    .chat-input {
      background-color: #343541;
      border-radius: 0.375rem;
      padding: 0.75rem 1rem;
      width: 100%;
      color: #d1d5db;
      border: none;
      outline: none;
      font-size: 1rem;
    }
    .disclaimer {
      font-size: 0.75rem;
      color: #6b7280;
      margin-top: 0.5rem;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      text-align: center;
    }
    footer {
      margin-top: auto;
      padding: 1rem 0;
      text-align: center;
      font-size: 0.875rem;
      color: #6b7280;
      background-color: #111827;
    }
    footer a {
      margin: 0 0.5rem;
    }
  </style>
</head>
<body>
  <header class="flex justify-between items-center px-6 py-4 border-b border-gray-700">
    <div class="header-logo">ChatGPT</div>
    <nav class="space-x-6">
      <a href="#" class="hover:underline">Log in</a>
      <a href="#" class="hover:underline font-semibold text-white">Sign up for free</a>
    </nav>
  </header>

  <main class="flex flex-col items-center flex-grow px-4">
    <h1 class="text-4xl font-semibold mt-16 mb-8 text-center max-w-xl">What can I help with?</h1>

    <section class="chat-area" aria-label="Chat input area">
      <input
        type="text"
        class="chat-input"
        placeholder="Temporary Chat"
        aria-describedby="chat-disclaimer"
        disabled
      />
      <p id="chat-disclaimer" class="disclaimer">
        This chat won't appear in history or be used to train our models. For safety purposes, we may keep a copy of this chat for up to 30 days.
      </p>
    </section>
  </main>

  <footer>
    By messaging ChatGPT, you agree to our
    <a href="https://openai.com/terms" target="_blank" rel="noopener noreferrer">Terms</a>
    and have read our
    <a href="https://openai.com/privacy" target="_blank" rel="noopener noreferrer">Privacy Policy</a>.
  </footer>
</body>
</html>
